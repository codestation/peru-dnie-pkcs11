when:
  event:
    - push
    - pull_request
  branch:
    - master

steps:
  verify:
    image: rust:1.95-trixie
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends pkg-config libpcsclite-dev libssl-dev
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo clippy --all-targets --all-features -- -D warnings
      - cargo test --all-features
      - cargo build --release
