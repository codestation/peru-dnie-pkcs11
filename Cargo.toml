[package]
name = "peru-dnie-pkcs11"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "PKCS#11 module for Peruvian DNIe card-bound PDF signing"
readme = "README.md"
keywords = ["pkcs11", "smartcard", "dnie", "pdf", "signature"]
categories = ["cryptography", "api-bindings"]
build = "build.rs"

[lib]
name = "peru_dnie_pkcs11"
crate-type = ["cdylib"]

[dependencies]
aes = "0.9.0"
anyhow = "1"
bp256 = { version = "0.14.0-rc.8", features = ["arithmetic"] }
cmac = "0.8.0"
cryptoki-sys = "0.5.0"
der = "0.8.0"
getrandom = "0.4.2"
num-bigint = "0.4.6"
num-traits = "0.2.19"
pcsc = "2"
sha2 = "0.10"
subtle = "2.6.1"
x509-cert = "0.3.0-rc.4"
zeroize = "1"
